services:
  ui:
    build: .
    ports: ["8501:8501"]
    env_file: .env
    volumes: ["./runtime:/app/runtime"]
    restart: unless-stopped
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./runtime:/app/runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
    restart: unless-stopped
